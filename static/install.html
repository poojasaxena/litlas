<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5EEDF">
  <title>Install Litlas</title>
  <link rel="manifest" href="litlas-manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F5EEDF;
      color: #463525;
      font: 1.125rem/1.5 Georgia, serif;
    }
    main { max-width: 27rem; padding: 2rem; text-align: center; }
    img { border-radius: 1rem; }
    h1 { margin: 0.5rem 0; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <img src="icon-192.png" alt="" width="96" height="96">
    <h1>Install Litlas</h1>
    <p>In Chrome, open the menu, choose <strong>Add to Home screen</strong>, then tap <strong>Install</strong> if prompted.</p>
    <a href="/">Open Litlas</a>
  </main>
</body>
</html>
