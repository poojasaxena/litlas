[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litlas"
version = "0.4.0"
description = "Explore Goodreads reading history by authors' countries of birth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38,<2", "streamlit-folium>=0.22,<1", "folium>=0.17,<1",
    "pandas>=2,<3", "pycountry>=24,<27", "countryinfo>=0.1.2,<1", "requests>=2.31,<3"
]

[project.scripts]
litlas = "litlas.launcher:main"
litlas-enrich = "litlas.enrichment.enrich:main"
litlas-prepare = "litlas.prepare:main"

[tool.setuptools.packages.find]
where = ["src"]
