[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litlas"
version = "0.4.0"
description = "An interactive literary atlas for exploring books, authors, reading journeys, and the world of literature"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Pooja Saxena" }
]

maintainers = [
    { name = "Pooja Saxena" }
]

dependencies = [
    "streamlit[auth]>=1.38,<2",
    "streamlit-folium>=0.22,<1",
    "folium>=0.17,<1",
    "pandas>=2,<3",
    "numpy>=1.26,<3",
    "plotly>=5.20,<7",
    "Pillow>=10,<13",
    "pycountry>=24,<27",
    "countryinfo>=0.1.2,<1",
    "requests>=2.31,<3",
    "country_converter>=0.7,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
litlas = "litlas.launcher:main"
litlas-cloud = "litlas.cloud_launcher:main"
litlas-prepare = "litlas.processing.prepare:main"
litlas-enrich = "litlas.enrichment.enrich:main"

[tool.setuptools.packages.find]
where = ["src"]
